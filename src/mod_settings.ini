[Mod]
Id = PressToGather
Name = Press to Gather - Configurable
Author = Tic0311; personal controller customization
Version = 2
Description = Hold RB / R1 to gather nearby resources. Choose the distance below, Apply, then load a save.

[Setting.GatherRadiusMeters]
Id = GatherRadiusMeters
Label = Gather Distance
Description = Distance around your character used for gathering. Apply, then load a save.
Type = integer
Minimum = 10
Maximum = 200
Step = 10
Decimals = 0
Suffix = m
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = GatherRadiusMeters

[Setting.debugLogging]
Id = debugLogging
Label = Logging
Description = Write detailed troubleshooting events to UE4SS.log. Leave Off for normal play. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
